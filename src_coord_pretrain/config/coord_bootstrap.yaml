model_path: "model_cache/Qwen/Qwen2.5-VL-3B-Instruct-max_coord_1024-fourier"
output_dir: "src_coord_pretrain/output/coord_bootstrap_ckpt"

data_path: "src_coord_pretrain/data/coord_bootstrap.jsonl"

# COORD SETTINGS
coordinate_tokens_enabled: true
max_coord_value: 1024
coordinate_init_mode: "fourier_ramp"

# TRAINING (YAML-driven like src_new)
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
llm_lr: 5.0e-6
mlp_lr: 2.0e-5
max_epochs: 2
logging_steps: 50
save_steps: 500
eval_steps: 200
val_ratio: 0.05
seed: 17
bf16: false
fp16: true
weight_decay: 0.0
freeze_vision: true
save_total_limit: 3

# DeepSpeed Zero-2 JSON (optional)
deep_speed_enabled: true
deipspeed_note: "If file not found, trainer will ignore"
deep_speed_placeholder: true
# Set the path below if available
# deepspeed_config: "/data3/Qwen2.5-VL-main/scripts/zero2.json"
