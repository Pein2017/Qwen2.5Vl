
model_path: /data3/Qwen2.5-VL-main
attn_implementation: eager
torch_dtype: bf16
use_cache: false
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1e-5
vision_lr: 5e-7
merger_lr: 1e-5
llm_lr: 5e-6
warmup_ratio: 0.0
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler_type: linear
gradient_checkpointing: false
bf16: true
fp16: false
train_data_path: data/ds_v2_full/all_samples.jsonl
val_data_path: data/ds_v2_full/all_samples.jsonl
data_root: data/ds_v2_full
teacher_pool_file: data/ds_v2_full/teacher_pool.jsonl
max_total_length: 4096
num_teacher_samples: 1
max_dataset_size: 2
teacher_loss_weight: 1.0
student_loss_weight: 1.0
coordinate_tokens_enabled: false
coordinate_init_mode: ms_mean
merge_size: 2
max_pixels: 1800000
output_dir: output
run_name: tmp
tb_dir: tb
max_coord_value: 2000
coordinate_loss_weight: 1.0
regular_loss_weight: 1.0
teacher_ratio: 0.0
collator_type: standard
eval_strategy: "no"
eval_steps: 100
save_strategy: "no"
save_steps: 100
save_total_limit: 1
load_best_model_at_end: false
metric_for_best_model: loss
greater_is_better: false
logging_steps: 50
report_to: none
disable_tqdm: true
dataloader_num_workers: 0
pin_memory: false
prefetch_factor: 2
remove_unused_columns: true
coord_aux_enabled: false
prog_unfreeze_enabled: false
augmentation:
  enabled: true
  rng_seed: 123
  apply_to_teachers: false
  lines_policy: drop_objects
  debug_visualization: false
  debug_output_dir: null
  op:
    sample_mode: fixed
    fixed_angle_deg: 15.0
    angle_min_deg: null
    angle_max_deg: null
    angles_set_deg: null
    expand: true
    interpolation: bilinear
    fill_color: [0,0,0]
  color_jitter:
    enabled: true
    apply_prob: 1.0
    brightness: [0.8, 1.2]
    contrast: [0.8, 1.2]
    saturation: [0.9, 1.1]
    sharpness: [0.9, 1.1]
