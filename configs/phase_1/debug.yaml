num_train_epochs: 10
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1 
logging_steps: 1
eval_strategy: steps
eval_steps: 2
best_checkpoint_interval_multiplier: 4
save_strategy: "no"  # Use manual saver only
save_steps: 1000
save_total_limit: 1 
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 5.0e-6
lr_coord_slice: 1.0e-4  # LR for trainable token rows (embedding + LM head)

collator_type: standard
teacher_ratio: 0.6
max_dataset_size: 10

# --- Dynamic pairing (bucketed random, no teacher_pool) ---
dynamic_pairing_enabled: true
# Small probability to sample teacher from all samples (cross-bucket exploration)
dynamic_pair_cross_bucket_explore_prob: 0.02

model_path: model_cache/Qwen/Qwen2.5-VL-7B-Instruct-line_tokens

run_name: "debug"
output_dir: outputs/debug

phase_name: phase_1
# Restrict training to only these special tokens (embeddings + LM head rows)

trainable_token_strings:
  - "<|line_start|>"
  - "<|line_end|>"
  - "<|box_start|>"
  - "<|box_end|>"
  - "<|quad_start|>"
  - "<|quad_end|>"

use_aug: false
augmentation_schedule:
  - { start_epoch: 0, preset: "moderate" }
  - { start_epoch: 1, preset: "aggressive" }

teacher_loss_weight: 0.6
student_loss_weight: 1
coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.2
grounding_loss_weight: 1.5
formatting_loss_weight: 0.3

conversation_variant_ratios:
  dense_caption: 0.5
  coords_to_desc: 0.15
  desc_to_coords: 0.25
  summary: 0.1


debug_alignment: true
# Enable global plain text JSON mode
