run_name: "debug_run_phase_1"
output_dir: outputs/debug_phase_1

# Separate-run phase control
phase_name: phase_1

# --------------------------------------------------------------------------------------
# Model
# --------------------------------------------------------------------------------------
model_path: src_coord_pretrain/output_back/checkpoint-3120

# --------------------------------------------------------------------------------------
# Training Settings
# --------------------------------------------------------------------------------------
num_train_epochs: 6
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 5.0e-6
vision_lr: 5.0e-7
llm_lr: 5.0e-6
gradient_checkpointing: false # Disable for easier debugging

max_dataset_size: 10 # Use a tiny subset for speed
teacher_ratio: 1.0 # Use only teacher samples for stable debugging

eval_steps: 2
save_steps: 4
logging_steps: 1

coordinate_tokens_enabled: false
coordinate_loss_weight: 1.0

coord_aux_enabled: false
coord_aux_tau: 1.2
coord_aux_sigma_bins: 8
coord_aux_window_bins: 32
coord_aux_topk: 100
coord_aux_lambda_kce: 1.0
coord_aux_lambda_unlike: 1.0

use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 4, preset: "moderate" }

debug_alignment: true

