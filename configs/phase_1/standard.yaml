num_train_epochs: 40
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2 
eval_strategy: steps
eval_steps: 20
save_strategy: "no"  # Use manual saver only
save_steps: 1000
save_total_limit: 2 
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 5.0e-6
lr_coord_slice: 5.0e-6

collator_type: standard
teacher_ratio: 0.6
max_dataset_size: -1
# Best checkpoint gating (manual saver)
best_checkpoint_interval_multiplier: 10
# best_checkpoint_min_interval_steps: 2000  # (optional) explicit min interval

dynamic_pairing_enabled: true
dynamic_pair_cross_bucket_explore_prob: 0.001

model_path: model_cache/Qwen/Qwen2.5-VL-7B-Instruct-line_tokens

run_name: "9-21-phase_1-test"
output_dir: outputs/7B-test/phase_1

phase_name: phase_1
# Selective unfreezing to avoid OOM: keep aligner unfrozen; unfreeze only last-K blocks
# Set K conservatively; tune if memory allows.
llm_top_k_block: 0           # 0=freeze all, -1=unfreeze all, k>0=last k
vision_top_k_block: 0        # 0=freeze all, -1=unfreeze all, k>0=last k
freeze_patch_embed: true     # keep patch embedding frozen for stability


trainable_token_strings:
  - "<|line_start|>"
  - "<|line_end|>"
  - "<|box_start|>"
  - "<|box_end|>"
  - "<|quad_start|>"
  - "<|quad_end|>"
  - "<|object_ref_start|>"
  - "<|object_ref_end|>"

use_aug: false
augmentation_schedule:
  - { start_epoch: 0, preset: "off" }
  - { start_epoch: 10, preset: "off" }


teacher_loss_weight: 0.6
student_loss_weight: 1

coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.2
grounding_loss_weight: 1.5
formatting_loss_weight: 0.8

conversation_variant_ratios:
  dense_caption: 1
  coords_to_desc: 0
  desc_to_coords: 0
  summary: 0

