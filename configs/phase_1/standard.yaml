num_train_epochs: 40
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4 
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 1000
save_total_limit: 2 
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 5.0e-6
# JSON mode: coord-slice lr not used
lr_top_layers: 1.0e-5

collator_type: standard
teacher_ratio: 0.6

dynamic_pairing_enabled: true
dynamic_pair_target_assignment: current
dynamic_pair_cross_bucket_explore_prob: 0.0
# Overlap-pool sampling + hardness controls (JSON)
pool_fraction: 0.2
pool_max: 512
hardness_alpha: 0.1
hardness_warmup_epochs: 1

model_path: model_cache/Qwen/Qwen2.5-VL-7B-Instruct-line_tokens

run_name: "9-15-special-phase_1-dynamic_pairing"
output_dir: outputs/7B-special/phase_1

phase_name: phase_1
# Restrict training to only these special tokens (embeddings + LM head rows)

use_aug: false
augmentation_schedule:
  - { start_epoch: 0, preset: "off" }
  - { start_epoch: 10, preset: "off" }

teacher_loss_weight: 0.6
student_loss_weight: 1
# JSON mode: no coordinate loss weight
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.2
grounding_loss_weight: 1.5
formatting_loss_weight: 0.3

conversation_variant_ratios:
  dense_caption: 0.5
  coords_to_desc: 0.25
  desc_to_coords: 0.25
  summary: 0

