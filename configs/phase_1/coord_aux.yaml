# ======================================================================================
# Coordinate Auxiliary Loss Configuration
#
# - Overrides `base.yaml` to enable and configure the coordinate auxiliary loss
#   and progressive unfreezing for coordinate-focused training.
# - Uses a different pretrained model checkpoint suitable for this task.
# ======================================================================================

# --------------------------------------------------------------------------------------
# Output & Run Name
# --------------------------------------------------------------------------------------
run_name: "8-29-coord_aux_phase_1"
output_dir: /data3/Qwen2.5-VL-main/outputs/8-29-coord_aux_phase_1

# Separate-run phase control
phase_name: phase_1

# --------------------------------------------------------------------------------------
# Model
# --------------------------------------------------------------------------------------
model_path: /data3/Qwen2.5-VL-main/src_coord_pretrain/output_back/checkpoint-3120

# --------------------------------------------------------------------------------------
# Training Settings
# --------------------------------------------------------------------------------------
vision_lr: 2.0e-7
llm_lr: 1.0e-5

# --------------------------------------------------------------------------------------
# Feature: Coordinate Tokens & Loss
# --------------------------------------------------------------------------------------
coordinate_tokens_enabled: true
coordinate_loss_weight: 1.0

# --------------------------------------------------------------------------------------
# Feature: Coordinate Auxiliary Loss
# --------------------------------------------------------------------------------------
coord_aux_enabled: true
coord_aux_tau: 1.2
coord_aux_sigma_bins: 12
coord_aux_window_bins: 48
coord_aux_topk: 300
coord_aux_lambda_kce: 1.5
coord_aux_lambda_unlike: 0.7


use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 2, preset: "moderate" }