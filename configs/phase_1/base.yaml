# ======================================================================================
# Base Configuration for BBU_V2 Training Pipeline
#
# This file defines the common, shared parameters for all training runs.
# It is designed to be a single source of truth for default settings.
# For specific experiments, create a new YAML file that overrides only
# the parameters that differ from this base configuration.
# ======================================================================================

# --------------------------------------------------------------------------------------
# Output & Logging Settings
#
# - output_dir: Base directory for all outputs (checkpoints, logs).
# - run_name:   UNIQUE name for the experiment. MUST BE OVERRIDDEN per run.
# - tb_dir:     Base directory for TensorBoard logs.
# --------------------------------------------------------------------------------------
output_dir: &output_dir outputs
run_name: "MUST_BE_OVERRIDDEN" # e.g., "experiment_8_20_coord_aux_run"
tb_dir: &tb_dir tb

# --------------------------------------------------------------------------------------
# Model Settings
#
# - model_path:               Path to the base model for fine-tuning.
# - attn_implementation:    Attention mechanism (e.g., "flash_attention_2", "eager").
# - torch_dtype:            Computation precision ("bfloat16", "float16").
# - use_cache:              Enable KV caching in the model (disable for training).
# --------------------------------------------------------------------------------------
model_path: outputs/7B/phase_3/9-2-7b-phase_3-smaller_lrs-added_data/checkpoint-5400
attn_implementation: flash_attention_2
torch_dtype: bfloat16
use_cache: false

# --------------------------------------------------------------------------------------
# Training Hyperparameters
#
# - num_train_epochs:           Total number of training epochs.
# - per_device_train_batch_size: Batch size per GPU for training.
# - per_device_eval_batch_size: Batch size per GPU for evaluation.
# - gradient_accumulation_steps: Number of steps to accumulate gradients before updating.
# - learning_rate:              Global learning rate (can be overridden by specific LRs).
# - vision_lr, merger_lr, llm_lr: Fine-grained learning rates for different model parts.
# - weight_decay:               L2 regularization strength.
# - max_grad_norm:              Gradient clipping threshold.
# - lr_scheduler_type:          Learning rate scheduler type (e.g., "cosine", "linear").
# --------------------------------------------------------------------------------------
num_train_epochs: 50
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-5
llm_lr: 5.0e-6
warmup_ratio: 0.1
weight_decay: 1.0e-3
max_grad_norm: 0.5
lr_scheduler_type: cosine
seed: 17

# --------------------------------------------------------------------------------------
# Phase-freeze (separate runs)
#   - off | phase_1 | phase_2 | phase_3
# --------------------------------------------------------------------------------------
phase_name: off

data_root: data/ds_v2_full
max_total_length: 12000
num_teacher_samples: 1
max_dataset_size: -1
collator_type: standard
teacher_ratio: 0
# Dynamic contrastive pairing (JSON mode)
dynamic_pairing_enabled: true
dynamic_pair_target_assignment: current
dynamic_pair_cross_bucket_explore_prob: 0.0
dynamic_pair_candidate_pool_size: 128
dynamic_pair_max_teacher_uses_per_epoch: 5
dynamic_pair_temperature: 0.7

bf16: true
fp16: false
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 1000
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false
logging_steps: 10
report_to: "tensorboard"
disable_tqdm: true

# --------------------------------------------------------------------------------------
# Performance & Dataloader Settings
#
# - dataloader_num_workers: Number of worker processes for data loading.
# - pin_memory:             Pin memory for faster data transfer to GPU.
# - prefetch_factor:        Number of batches to prefetch.
# - remove_unused_columns:  Remove columns not used by the model.
# --------------------------------------------------------------------------------------
dataloader_num_workers: 8
pin_memory: true
prefetch_factor: 4
remove_unused_columns: false

# --------------------------------------------------------------------------------------
# Feature Flags & Vision Processing
#
# - coordinate_tokens_enabled: Enable training with coordinate tokens.
# - merge_size:               Patch merge size for vision tower.
# - max_pixels:               Maximum number of pixels for image processing.
# --------------------------------------------------------------------------------------
# JSON mode: no coordinate token training toggles required here
merge_size: 2
max_pixels: 401408

# --------------------------------------------------------------------------------------
# Loss Weights
#
# - teacher_loss_weight:    Weight for the teacher loss component.
# - student_loss_weight:    Weight for the student loss component.
# - coordinate_loss_weight: Weight for the coordinate token part of the loss.
# - regular_loss_weight:    Weight for the regular text part of the loss.
# --------------------------------------------------------------------------------------
teacher_loss_weight: 0.6
student_loss_weight: 1
# JSON mode: no coordinate loss weight


# --------------------------------------------------------------------------------------
# Augmentation Settings
#
# - use_aug:  Global switch to enable/disable augmentations.
# - augmentation:
#   - preset: Pre-configured augmentation strength ("off", "conservative", "moderate").
#   - See src_new/config/augmentation_config.py for all options.
# --------------------------------------------------------------------------------------
use_aug: false
augmentation:
  preset: "off"
  rng_seed: 12345
  apply_to_teachers: false
  lines_policy: "transform"
  object_transform: "cut_paste"
  rotation_strength: "medium"
  photometric_strength: "light"
  blur_strength: "off"

# JSON mode: coordinate auxiliary losses removed

