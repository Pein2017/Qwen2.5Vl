# BBU Qwen2.5-VL Training Config

# MODEL SETTINGS
model_path: "/data3/Qwen2.5-VL-main/model_cache/Qwen/Qwen2.5-VL-3B-Instruct"
model_size: "3B"
model_max_length: 32000  # Reduced for memory efficiency with coordinate tokens
attn_implementation: "flash_attention_2"
torch_dtype: "bfloat16"
use_cache: false
use_cache_inference: true
model_hidden_size: 2048
model_num_layers: 36
model_num_attention_heads: 16
model_vocab_size: 151665
# TRAINING SETTINGS
num_train_epochs: 200
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 5e-6
vision_lr: 5e-7
merger_lr: 1e-5
llm_lr: 5e-6

adapter_lr: 0.0
warmup_ratio: 0.05
weight_decay: 0.0001
max_grad_norm: 0.1  
lr_scheduler_type: "cosine"
gradient_checkpointing: true
bf16: true
fp16: false
use_flash_attention: true
mixed_precision: "bf16"

# DATA SETTINGS
train_data_path: "data/ds_v2_full/train.jsonl"
val_data_path: "data/ds_v2_full/val.jsonl"
data_root: "data/ds_v2_full"
max_total_length: 12000
teacher_pool_file: "data/ds_v2_full/teacher_pool.jsonl"
num_teacher_samples: 1
collator_type: "packed"
teacher_ratio: 0.5  # ~50% batches without teachers (improves zero-shot capability)
language: "chinese"
max_dataset_size: -1


# EVALUATION SETTINGS
# Reduced frequency to minimize NCCL timeout risks
eval_strategy: "steps"
eval_steps: 20  # Reduced to minimize evaluation overhead
save_strategy: "steps"
save_steps: 50  # Increased to reduce checkpoint frequency
save_total_limit: 2  # Keep more checkpoints for safety

# LOGGING SETTINGS
logging_steps: 10  # Reduced logging overhead
logging_dir: "logs"
report_to: "tensorboard"
disable_tqdm: true
verbose: false


# COORDINATE TOKEN CONFIG
coordinate_tokens_enabled: true
max_coord_value: 1024
coordinate_loss_weight: 0.05
regular_loss_weight: 1.0

# ESSENTIAL SETTINGS
remove_unused_columns: false

# DATALOADER PERFORMANCE
dataloader_num_workers: 4
pin_memory: true
prefetch_factor: 2

# OUTPUT SETTINGS
output_dir: "output-730"
run_name: "7-30-use_coord"
tb_dir: "tb"

# TEACHER-STUDENT LOSS WEIGHTS
teacher_loss_weight: 0.3
student_loss_weight: 1.0

# VISION PROCESSING PARAMETERS
patch_size: 14
merge_size: 2
temporal_patch_size: 2

# TRAINING CONTROL FLAGS
training_prompt_style: true
use_consistent_prompts: true
