# BBU Qwen2.5-VL Training Config

# OUTPUT SETTINGS
output_dir: "output-814-msmean-ep50-coord_aux-Prog_longer"
run_name: "814-msmean-ep50-coord_aux-Prog_longer"
tb_dir: "tb"

# MODEL SETTINGSd
model_path: "model_cache/Qwen/Qwen2.5-VL-3B-Instruct-max_coord_1024_msmean"
model_size: "3B"
model_max_length: 12000  
attn_implementation: "flash_attention_2"
torch_dtype: "bfloat16"
use_cache: false
use_cache_inference: true
model_hidden_size: 2048
model_num_layers: 36
model_num_attention_heads: 16
model_vocab_size: 151665
# TRAINING SETTINGS
num_train_epochs: 50
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 5e-5
vision_lr: 1e-7
merger_lr: 5e-5
llm_lr: 5e-6

adapter_lr: 0.0
warmup_ratio: 0.1
weight_decay: 0.0001
max_grad_norm: 0.5
lr_scheduler_type: "cosine"
gradient_checkpointing: true
bf16: true
fp16: false
use_flash_attention: true
mixed_precision: "bf16"

# DATA SETTINGS
data_root: "data/ds_v2_bbu_bbu_shield"
max_total_length: 12000
num_teacher_samples: 1
collator_type: "packed"
teacher_ratio: 0.5  
language: "chinese"
max_dataset_size: -1


# EVALUATION SETTINGS
# Reduced frequency to minimize NCCL timeout risks
eval_strategy: "steps"
eval_steps: 20  # Reduced to minimize evaluation overhead
save_strategy: "steps"
save_steps: 200  # Increased to reduce checkpoint frequency
save_total_limit: 2  # Keep more checkpoints for safety

# BEST CHECKPOINT TRACKING
load_best_model_at_end: true  # Enable automatic best checkpoint saving
metric_for_best_model: "eval_loss"  # Track evaluation loss for best model
greater_is_better: false  # Lower eval_loss is better
save_on_each_node: false  # EFFICIENCY: Only rank 0 saves checkpoints

# LOGGING SETTINGS
logging_steps: 10  # Reduced logging overhead
logging_dir: "logs"
report_to: "tensorboard"
disable_tqdm: true
verbose: false


# COORDINATE TOKEN CONFIG
coordinate_tokens_enabled: true
max_coord_value: 1024
coordinate_loss_weight: 1
regular_loss_weight: 1.0

coordinate_init_mode: "fourier_ramp"  # new: deterministic coord embedding init

# COORDINATE AUXILIARY LOSSES (enable to use new feature)
coord_aux_enabled: true
coord_aux_tau: 1.2  # Temperature for coord-slice softmax in Kernelized-KL (higher = smoother p)
coord_aux_sigma_bins: 8  # Gaussian sigma (in bins) for target kernel q; larger = broader tolerance
coord_aux_window_bins: 32  # Half-window around GT (in bins); compute KL only on [y-window, y+window]
coord_aux_topk: 100  # Unlikelihood: top-k non-coordinate tokens to suppress at coord positions
coord_aux_lambda_kce: 1  # Weight for Kernelized-KL term in coord aux loss
coord_aux_lambda_unlike: 1  # Weight for Unlikelihood term penalizing non-coordinate mass at coord positions

# ESSENTIAL SETTINGS
remove_unused_columns: false

# DATALOADER PERFORMANCE
dataloader_num_workers: 4
pin_memory: true
prefetch_factor: 2

# TEACHER-STUDENT LOSS WEIGHTS
teacher_loss_weight: 0.3
student_loss_weight: 1.0

# VISION PROCESSING PARAMETERS
patch_size: 14
merge_size: 2
temporal_patch_size: 2
max_pixels: 401408  # 512 * 28 * 28 - controls Qwen2VL image processor pixel limit

# TRAINING CONTROL FLAGS
training_prompt_style: true
use_consistent_prompts: true

# MODEL LOADING CONTROL FLAGS
skip_vocab_extension: false

# PROGRESSIVE UNFREEZE (staged training)
prog_unfreeze_enabled: true
prog_unfreeze_epoch_stage0_end: 2
prog_unfreeze_epoch_stage1_end: 6
prog_unfreeze_top_k_layers: 4
prog_unfreeze_coord_slice_only: true

# Optional LR overrides for groups
lr_merger: 1.0e-5
lr_coord_slice: 5.0e-5
lr_top_layers: 1.2e-5
lr_full_model: 1.0e-5