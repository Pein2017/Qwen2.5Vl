checkpoint: outputs/7B-full/phase_3/9-8-7b-full-phase_3/best-1000-eval_loss0.4698
processor: outputs/7B-full/phase_3/9-8-7b-full-phase_3/best-1000-eval_loss0.4698
train_data_dir: /data3/Qwen2.5-VL-main/group_data/bbu_scene_2.0_order/BBU安装方式检查（正装）
eval_data_dir: ''
output_dir: output-post/grpo-bbu_install
mission: bbu安装方式检查
device: cuda
seed: 17

# Generation
temperature: 0.01
top_p: 0.5
max_new_tokens_stage_a: 64
max_new_tokens_stage_b: 128
mask_geometry_tokens: true
mask_coordinate_tokens: true
sanitize_stage_a: false

# Sampling (GRPO)
K_B: 2
K_A: 3
adv_clip: 1.5
length_norm: true

# Training
train: true
epochs: 1
batch_size: 1
drop_last: true
learning_rate: 1.0e-05
weight_decay: 1e-3
max_grad_norm: 0.5

# Selective unfreeze (src_new-like)
# Unfreeze only the last top-K layers/blocks and the aligner; keep patch_embed frozen for stability
top_k_llm_layers: 1
top_k_vision_blocks: 0
freeze_vision_patch_embed: true
train_aligner: true

# Differential learning rates
aligner_lr: 1.5e-05
llm_lr: 8.0e-06
vision_lr: 1.0e-06

# LR scheduler
lr_scheduler_type: cosine
warmup_ratio: 0.1

# TensorBoard logging
tb_log_dir: tb_post
run_name: debug

# KL regularization
use_ref_kl: true
ref_checkpoint: outputs/7B-full/phase_3/9-8-7b-full-phase_3/best-1000-eval_loss0.4698
lambda_kl_stage_b: 0.0
lambda_kl_stage_a: 0.02

# Stage-A mode
train_stage_a_mode: conditional
stage_a_weight: 2.0
K_set: 1

# Rewards
reward_fns: label_match,decision_prob,violations,coverage,formatting,cleanliness,rep_penalty,quote_penalty,special_penalty,consistency
reward_weights: 1.0,0.7,0.5,0.2,0.1,0.2,-0.7,-0.4,-1.0,0.2

# Misc
limit_groups: 3
results_jsonl: output-post/results.jsonl
max_images_tf: 1
