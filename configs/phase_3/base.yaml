# ======================================================================================
# Base Configuration for BBU_V2 Training Pipeline
#
# This file defines the common, shared parameters for all training runs.
# It is designed to be a single source of truth for default settings.
# For specific experiments, create a new YAML file that overrides only
# the parameters that differ from this base configuration.
# ======================================================================================

# --------------------------------------------------------------------------------------
# Output & Logging Settings
#
# - output_dir: Base directory for all outputs (checkpoints, logs).
# - run_name:   UNIQUE name for the experiment. MUST BE OVERRIDDEN per run.
# - tb_dir:     Base directory for TensorBoard logs.
# --------------------------------------------------------------------------------------
output_dir: &output_dir outputs
run_name: "MUST_BE_OVERRIDDEN" # e.g., "experiment_8_20_coord_aux_run"
tb_dir: &tb_dir tb

model_path: model_cache/Qwen/Qwen2.5-VL-3B-Instruct
attn_implementation: flash_attention_2
torch_dtype: bfloat16
use_cache: false

num_train_epochs: 20
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 5.0e-6
lr_top_layers: 1.0e-5
lr_coord_slice: 5.0e-6
warmup_ratio: 0.2
weight_decay: 1.0e-3
max_grad_norm: 1
lr_scheduler_type: cosine
seed: 17

# --------------------------------------------------------------------------------------
# Phase-freeze (separate runs)
#   - off | phase_1 | phase_2 | phase_3
# --------------------------------------------------------------------------------------
phase_name: phase_3

data_root: data/ds_v2_bbu_bbu_shield
max_total_length: 12000
num_teacher_samples: 1
max_dataset_size: -1
collator_type: standard
teacher_ratio: 0.1

bf16: true
fp16: false
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 500
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false
logging_steps: 10
report_to: "tensorboard"
disable_tqdm: true

# --------------------------------------------------------------------------------------
# Performance & Dataloader Settings
#
# - dataloader_num_workers: Number of worker processes for data loading.
# - pin_memory:             Pin memory for faster data transfer to GPU.
# - prefetch_factor:        Number of batches to prefetch.
# - remove_unused_columns:  Remove columns not used by the model.
# --------------------------------------------------------------------------------------
dataloader_num_workers: 4
pin_memory: true
prefetch_factor: 2
remove_unused_columns: false

# --------------------------------------------------------------------------------------
# Feature Flags & Vision Processing
#
# - coordinate_tokens_enabled: Enable training with coordinate tokens.
# - merge_size:               Patch merge size for vision tower.
# - max_pixels:               Maximum number of pixels for image processing.
# --------------------------------------------------------------------------------------
coordinate_tokens_enabled: false
merge_size: 2
max_pixels: 401408
max_coord_value: 1024
# coordinate_init_mode: "fourier_ramp"  # removed for pure LLM training

teacher_loss_weight: 0.6
student_loss_weight: 1
# JSON mode: no coordinate loss weight
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.0
grounding_loss_weight: 1.0
formatting_loss_weight: 0.3

# --------------------------------------------------------------------------------------
# Augmentation Settings
#
# - use_aug:  Global switch to enable/disable augmentations.
# - augmentation:
#   - preset: Pre-configured augmentation strength ("off", "conservative", "moderate").
#   - See src_new/config/augmentation_config.py for all options.
# --------------------------------------------------------------------------------------
use_aug: false
augmentation:
  preset: "moderate"
  rng_seed: 12345
  apply_to_teachers: false
  lines_policy: "transform"
  object_transform: "cut_paste"
  rotation_strength: "medium"
  photometric_strength: "light"
  blur_strength: "off"

# Optional: schedule augmentation presets by epoch for phase_2
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 3, preset: "moderate" }

# --------------------------------------------------------------------------------------
# Coordinate Auxiliary Loss Settings (Disabled / removed for pure LLM)
# --------------------------------------------------------------------------------------
coord_aux_enabled: false
# coord_aux_tau: null                # removed
# coord_aux_sigma_bins: null         # removed
# coord_aux_window_bins: null        # removed
# coord_aux_topk: null               # removed
# coord_aux_lambda_kce: null         # removed
# coord_aux_lambda_unlike: null      # removed

debug_alignment: false
