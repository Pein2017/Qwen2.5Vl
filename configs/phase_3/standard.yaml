num_train_epochs: 50
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4  
learning_rate: 5.0e-4
vision_lr: 5.0e-7
merger_lr: 1.0e-5
llm_lr: 1.0e-6
lr_top_layers: 5.0e-6
lr_coord_slice: 1.0e-6

weight_decay: 1.0e-3
teacher_ratio: 0

model_path: outputs/7B-full-retrained/phase_2/9-11-phase_2-bs_16-ep_40-teacher_0-3_types_tokens-last_6_layers-resume/best-3000-eval_loss0.4312

run_name: "9-12-phase_3-train_all"
output_dir: outputs/7B-full-retrained/phase_3

phase_name: phase_3
# Selective unfreezing to avoid OOM: keep aligner unfrozen; unfreeze only last-K blocks
# Set K conservatively; tune if memory allows.
llm_top_k_block: 0           # unfreeze last 8 LLM blocks
vision_top_k_block: 0        # unfreeze last 6 vision blocks
freeze_patch_embed: true     # keep patch embedding frozen for stability


trainable_token_strings:
  - "<|line_start|>"
  - "<|line_end|>"
  - "<|box_start|>"
  - "<|box_end|>"
  - "<|quad_start|>"
  - "<|quad_end|>"

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "moderate" }
  - { start_epoch: 25, preset: "aggressive" }
  
# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.8
    num_ops: 1
    magnitude: 0.4
    ocr_safe_pool: true

teacher_loss_weight: 0.6
student_loss_weight: 1
coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.2
grounding_loss_weight: 1.5
formatting_loss_weight: 0.3

conversation_variant_ratios:
  dense_caption: 0.3
  coords_to_desc: 0.3
  desc_to_coords: 0.2
  summary: 0.2
