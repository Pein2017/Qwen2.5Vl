num_train_epochs: 50
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4  
learning_rate: 5.0e-4
vision_lr: 1.0e-6
merger_lr: 5.0e-4
llm_lr: 1.0e-5
lr_top_layers: 5.0e-6
lr_coord_slice: 5.0e-6

weight_decay: 1.0e-3
teacher_ratio: 0.2

model_path: outputs/7B/phase_2/9-2-7b-phase_2/checkpoint-1100

run_name: "9-4-7b-phase_3-ratio_4_3_3-epoch_50"
output_dir: outputs/7B/phase_3

phase_name: phase_3

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "moderate" }
  - { start_epoch: 20, preset: "aggressive" }
  
# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.8
    num_ops: 1
    magnitude: 0.4
    ocr_safe_pool: true

teacher_loss_weight: 0.6
student_loss_weight: 1
coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.2
grounding_loss_weight: 1.5
formatting_loss_weight: 0.3

conversation_variant_ratios:
  dense_caption: 0.4
  coords_to_desc: 0.3
  desc_to_coords: 0.3