# --- Run settings (high-frequency) ---
run_name: "714-det"
output_dir: "output-714"
bf16: true
fp16: false
learning_rate: 0
adapter_lr: 5e-3
vision_lr: 5e-7
merger_lr: 1e-5
llm_lr: 5e-6
coordinate_lr: 1e-4  # Learning rate for coordinate token components
num_train_epochs: 20
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
coordinate_tokens_enabled: true  # Enable coordinate token soft expectation

# --- Model settings ---
model_path: "/data3/Qwen2.5-VL-main/model_cache/Qwen/Qwen2.5-VL-3B-Instruct"
model_size: "3B"
model_max_length: 120000
model_hidden_size: 3584
model_num_layers: 28
model_num_attention_heads: 28
model_vocab_size: 152064
attn_implementation: "flash_attention_2"  # Keep flash attention for speed
use_flash_attention: false
torch_dtype: "bfloat16"
mixed_precision: "bf16"
gradient_checkpointing: true
use_cache: false

# --- Vision processing parameters ---
patch_size: 14 # Spatial patch size of vision encoder
merge_size: 2 # Merge size from vision encoder to LLM encoder
temporal_patch_size: 2 # Temporal patch size of vision encoder

# --- Optimization settings ---
warmup_ratio: 0.1
weight_decay: 0.001
max_grad_norm: 0.5
lr_scheduler_type: "cosine"
gradient_clip_reduction_factor: 0.5
learning_rate_reduction_factor: 0.5

# --- Data settings ---
train_data_path: "data/train.jsonl"
val_data_path: "data/val.jsonl"
candidates_file: null # Disabled
teacher_pool_file: "data/teacher.jsonl"
data_root: "./"
max_total_length: 12000
use_candidates: false
collator_type: "packed"
max_examples: 1
language: "chinese"
teacher_ratio: 0.7 # Ratio of samples that use teachers during training (0.0-1.0)
num_teacher_samples: 1


# --- Coordinate Token Configuration ---
coordinate_config:
  enable_coordinate_tokens: true
  max_coord_value: 2048  # Coordinate resolution (0-2047)
  coord_token_init_std: 0.01  # Initialization std for coordinate tokens
  coordinate_loss_weight: 1.0  # Weight for coordinate token loss
  regular_loss_weight: 1.0  # Weight for regular token loss
  soft_expectation_temperature: 1.0  # Softmax temperature for soft expectation
  focal_loss_alpha: 0.25  # Alpha parameter for focal loss
  focal_loss_gamma: 2.0  # Gamma parameter for focal loss

# --- ChatProcessor Coordinate Settings ---
chat_processor:
  enable_coordinate_tokens: true
  max_coord_value: 2048
  use_official_box_tokens: true

# --- Evaluation settings ---
eval_strategy: "steps"
eval_steps: 10
save_strategy: "steps"
save_steps: 50
save_total_limit: 2

# --- Logging settings ---
logging_steps: 1
logging_dir: "logs"
log_level: "INFO"
report_to: "tensorboard"
tb_dir: "tb"
verbose: true
disable_tqdm: true

# --- Monitoring settings ---
enable_monitoring: false
save_predictions: true
save_token_analysis: true
save_raw_text: true

# --- Performance settings ---
dataloader_num_workers: 0
pin_memory: false
prefetch_factor: 2
batching_strategy: "standard"
remove_unused_columns: false

# --- Stability settings ---
max_consecutive_nan: 5
max_consecutive_zero: 5
max_nan_ratio: 0.3
nan_monitoring_window: 100
allow_occasional_nan: true
nan_recovery_enabled: true

# --- Debug settings ---
test_samples: 1
test_forward_pass: false

# --- Teacher-Student Loss Weights ---
teacher_loss_weight: 0.3  # Weight for teacher loss in backpropagation
student_loss_weight: 1.0  # Weight for student loss in backpropagation

# --- Learning Rate Auto-Scaling ---
auto_scale_lr: false # Automatically adjust LRs based on collator type
lr_reference_batch_size: 0 # Disable reference batch size scaling

# --- Training Behavior Control ---
use_differential_lr: true
use_consistent_prompts: true
training_prompt_style: true
val_zero_shot: false

# --- Teacher-Student System ---
teacher_performance_log_interval: 50
teacher_assignment_log_interval: 100
student_performance_tracking_enabled: true

# --- Loss Weights and Parameters ---
coordinate_token_focal_loss_weight: 0.1
nan_loss_replacement_value: 1e-6

# --- Data Processing ---
sequence_length_estimation_samples: 100
default_sequence_length_estimate: 8192
min_validation_ratio: 0.8
cross_sample_boundary_masking: true

# --- Parameter Management ---
adapter_weight_decay_factor: 0.1
high_lr_ratio_warning_threshold: 1000

# --- Logging and Monitoring ---
gradient_norm_tracking_enabled: false
component_gradient_logging_enabled: true
image_debug_logging_enabled: false
attention_mask_validation_enabled: true
tensor_shape_validation_enabled: true

# --- Chat Processing ---
endoftext_auto_append: true
vision_token_spacing_enabled: true
chat_template_validation_enabled: true

