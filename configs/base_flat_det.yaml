# =============================================================================
# BBU Qwen2.5-VL Training Configuration - Cleaned and Organized
# =============================================================================

# --- Core Training Settings ---
run_name: "719-det"
output_dir: "output-719"
run_output_dir: "output-719"
num_train_epochs: 30
per_device_train_batch_size: 6
per_device_eval_batch_size: 6
gradient_accumulation_steps: 4

# --- Precision Settings ---
bf16: true
fp16: false
mixed_precision: "bf16"
torch_dtype: "bfloat16"

# --- Differential Learning Rates (0 = frozen) ---
learning_rate: 5e-6        # Base learning rate
vision_lr: 5e-7            # Vision encoder
merger_lr: 1e-5            # Vision-language connector
llm_lr: 5e-6               # Language model
coordinate_lr: 1e-4        # Coordinate token components
adapter_lr: 5e-3           # Adapter layers
detection_lr: 1e-4         # Legacy detection head (unused)

# --- Coordinate Token System ---
coordinate_tokens_enabled: true

# --- Model Configuration ---
model_path: "/data3/Qwen2.5-VL-main/model_cache/Qwen/Qwen2.5-VL-3B-Instruct"
model_size: "3B"
model_max_length: 120000
model_hidden_size: 3584
model_num_layers: 28
model_num_attention_heads: 28
model_vocab_size: 153713  # Base (151665) + coordinate tokens (2048)
attn_implementation: "flash_attention_2"
torch_dtype: "bfloat16"
mixed_precision: "bf16"
use_flash_attention: true
use_cache: false
gradient_checkpointing: true

# --- Vision Processing ---
patch_size: 14
merge_size: 2
temporal_patch_size: 2

# --- Optimization ---
warmup_ratio: 0.1
weight_decay: 0.001
max_grad_norm: 0.5
lr_scheduler_type: "cosine"

# --- Data Configuration ---
train_data_path: "data/train.jsonl"
val_data_path: "data/val.jsonl"
teacher_pool_file: "data/teacher.jsonl"
data_root: "./"
max_total_length: 12000
collator_type: "packed"
max_examples: 1
language: "chinese"
teacher_ratio: 0.7
num_teacher_samples: 1
use_candidates: false
candidates_file: null


# --- Coordinate Token Configuration (Flattened for DirectConfig compatibility) ---
coordinate_config_enable_coordinate_tokens: true
coordinate_config_max_coord_value: 2048
coordinate_config_coord_token_init_std: 0.01
coordinate_config_coordinate_loss_weight: 1.0
coordinate_config_regular_loss_weight: 1.0
coordinate_config_soft_expectation_temperature: 1.0
coordinate_config_focal_loss_alpha: 0.25
coordinate_config_focal_loss_gamma: 2.0
coordinate_config_use_official_box_tokens: true

# --- ChatProcessor Settings (Flattened) ---
chat_processor_enable_coordinate_tokens: true
chat_processor_max_coord_value: 2048
chat_processor_use_official_box_tokens: true

# --- Legacy Coordinate Token Configuration (Nested for domain configs) ---
coordinate_config:
  enable_coordinate_tokens: true
  max_coord_value: 2048
  coord_token_init_std: 0.01
  coordinate_loss_weight: 1.0
  regular_loss_weight: 1.0
  soft_expectation_temperature: 1.0
  focal_loss_alpha: 0.25
  focal_loss_gamma: 2.0
  use_official_box_tokens: true

chat_processor:
  enable_coordinate_tokens: true
  max_coord_value: 2048
  use_official_box_tokens: true

# --- Evaluation & Saving ---
eval_strategy: "steps"
eval_steps: 1
save_strategy: "no"
save_steps: 50
save_total_limit: 2

# --- Logging ---
logging_steps: 1
logging_dir: "logs"
tensorboard_dir: "logs"
log_level: "INFO"
report_to: "tensorboard"
tb_dir: "tb"
disable_tqdm: true
verbose: false

# --- Essential Settings ---
remove_unused_columns: false

# --- DataLoader Performance Settings ---
dataloader_num_workers: 4
pin_memory: true
prefetch_factor: 2

# --- Testing ---
test_samples: 1
test_forward_pass: false

# --- Teacher-Student Learning ---
teacher_loss_weight: 0.3
student_loss_weight: 1.0
teacher_performance_log_interval: 50
teacher_assignment_log_interval: 100
student_performance_tracking_enabled: true

# --- Training Control ---
use_differential_lr: true
use_consistent_prompts: true
training_prompt_style: true
val_zero_shot: false
auto_scale_lr: false
lr_reference_batch_size: 0

# --- Loss Configuration ---
coordinate_token_focal_loss_weight: 0.1
nan_loss_replacement_value: 1e-6





