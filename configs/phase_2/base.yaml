output_dir: &output_dir outputs
run_name: "MUST_BE_OVERRIDDEN" # e.g., "experiment_8_20_coord_aux_run"
tb_dir: &tb_dir tb

model_path: model_cache/Qwen/Qwen2.5-VL-3B-Instruct
attn_implementation: flash_attention_2
torch_dtype: bfloat16
use_cache: false

# --------------------------------------------------------------------------------------
num_train_epochs: 20
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 5.0e-6
lr_top_layers: 1.0e-5
lr_coord_slice: 5.0e-6
warmup_ratio: 0.2
weight_decay: 1.0e-3

max_grad_norm: 0.5
lr_scheduler_type: cosine
seed: 17

phase_name: phase_2

data_root: data/ds_v2_full
max_total_length: 12000
num_teacher_samples: 1
max_dataset_size: -1
collator_type: standard
teacher_ratio: 0.2

bf16: true
fp16: false
gradient_checkpointing: true
eval_strategy: steps
eval_steps: 20
save_strategy: steps
save_steps: 500
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false
logging_steps: 10
report_to: "tensorboard"
disable_tqdm: true

dataloader_num_workers: 4
pin_memory: true
prefetch_factor: 2
remove_unused_columns: false

# JSON mode: no coordinate token toggles
merge_size: 2
max_pixels: 401408

teacher_loss_weight: 0.6
student_loss_weight: 1
# JSON mode: no coordinate loss weight

use_aug: true
augmentation:
  preset: "moderate"
  rng_seed: 12345
  apply_to_teachers: false
  lines_policy: "transform"
  object_transform: "cut_paste"
  rotation_strength: "medium"
  photometric_strength: "light"
  blur_strength: "off"

# Optional: schedule augmentation presets by epoch for phase_2
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 3, preset: "moderate" }

coord_aux_enabled: false

