num_train_epochs: 40
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 1.0e-5
lr_top_layers: 1.0e-5
# JSON mode: remove coord-slice lr
llm_top_k_block: 4   

collator_type: standard
# JSON mode: packed segment isolation not used
teacher_ratio: 0.6 

model_path: model_cache/Qwen/Qwen2.5-VL-3B-Instruct

run_name: "9-16-json-phase_2-dynamic_teacher"
output_dir: outputs/7B-json/phase_2

phase_name: phase_2
# Restrict training to only these special tokens (embeddings + LM head rows)


dynamic_pairing_enabled: true
dynamic_pair_target_assignment: current
dynamic_pair_cross_bucket_explore_prob: 0.0
dynamic_pair_candidate_pool_size: 128
dynamic_pair_max_teacher_uses_per_epoch: 5
dynamic_pair_temperature: 0.7

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "off" }
  - { start_epoch: 2, preset: "conservative" }
  - { start_epoch: 20, preset: "moderate" }


# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.5
    num_ops: 1
    magnitude: 0.3
    ocr_safe_pool: true

teacher_loss_weight: 0.6
student_loss_weight: 1
# JSON mode: no coordinate loss weight
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.0
grounding_loss_weight: 1.2
formatting_loss_weight: 0.3


conversation_variant_ratios:
  dense_caption: 0.4
  coords_to_desc: 0.2
  desc_to_coords: 0.4

