num_train_epochs: 50
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 1.0e-5
lr_top_layers: 1.0e-5
lr_coord_slice: 5.0e-6

# Continue from phase_1 checkpoint
model_path: outputs/8-29-standard_phase_1/8-29-standard_phase_1-ep50-merger_5e-4/checkpoint-600

run_name: "8-30-standard_phase_2-ep50-merger_5e-4-top_lr-1e-5-start_epoch_10-taug"
output_dir: /data3/Qwen2.5-VL-main/outputs/8-30-standard_phase_2

phase_name: phase_2

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 10, preset: "moderate" }

# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.8
    num_ops: 1
    magnitude: 0.4
    ocr_safe_pool: true
