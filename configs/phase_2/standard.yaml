num_train_epochs: 50
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 1.0e-5
lr_top_layers: 1.0e-6
lr_coord_slice: 5.0e-6

model_path: outputs/7B-full/phase_1/9-5-7b-full-phase_1-merger_1e-4/checkpoint-3150

run_name: "9-6-7b-full-phase_2"
output_dir: outputs/7B-full/phase_2

phase_name: phase_2

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "conservative" }
  - { start_epoch: 20, preset: "moderate" }

# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.8
    num_ops: 1
    magnitude: 0.4
    ocr_safe_pool: true

teacher_loss_weight: 0.6
student_loss_weight: 1
coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 2.0
grounding_loss_weight: 1.0
formatting_loss_weight: 0.3
