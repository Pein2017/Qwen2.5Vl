num_train_epochs: 40
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2  
learning_rate: 5.0e-5
vision_lr: 1.0e-7
merger_lr: 5.0e-4
llm_lr: 1.0e-5
lr_coord_slice: 5.0e-6
llm_top_k_block: 6           # 0=freeze all, -1=unfreeze all, k>0=last k
vision_top_k_block: 0        # 0=freeze all, -1=unfreeze all, k>0=last k

collator_type: standard
teacher_ratio: 0.4

best_checkpoint_interval_multiplier: 10
# best_checkpoint_min_interval_steps: 2000  # (optional) explicit min interval

dynamic_pairing_enabled: true
dynamic_pair_cross_bucket_explore_prob: 0.01

model_path: outputs/7B-dynamic_pairing/phase_1/9-17-dynamic_pairing-phase_1/checkpoint-2000

run_name: "9-17-dynamic_pairing-phase_2-last_blocks_6-later_checkpoint-2000"
output_dir: outputs/7B-dynamic_pairing/phase_2

phase_name: phase_2
# Restrict training to only these special tokens (embeddings + LM head rows)
trainable_token_strings:
  - "<|line_start|>"
  - "<|line_end|>"
  - "<|box_start|>"
  - "<|box_end|>"
  - "<|quad_start|>"
  - "<|quad_end|>"
  - "<|object_ref_start|>"
  - "<|object_ref_end|>"

# Enable augmentation in phase_2
use_aug: true
augmentation_schedule:
  - { start_epoch: 0, preset: "off" }
  - { start_epoch: 2, preset: "conservative" }
  - { start_epoch: 20, preset: "moderate" }


# Dedicated teacher augmentation (photometric-only)
teacher_augmentation:
  rng_seed: 12345
  photometric:
    enabled: true
    apply_prob: 0.5
    num_ops: 1
    magnitude: 0.2
    ocr_safe_pool: true

teacher_loss_weight: 0.6
student_loss_weight: 1
coordinate_loss_weight: 0.0  # keep at 0.0 for pure LLM training
# Group Loss Weights (caption/grounding/formatting)
caption_loss_weight: 1.0
grounding_loss_weight: 1.2
formatting_loss_weight: 0.3


conversation_variant_ratios:
  dense_caption: 0.4
  coords_to_desc: 0.2
  desc_to_coords: 0.3

